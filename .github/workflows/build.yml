name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub Release with this tag (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  make:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-exe
            arch: x64
            files: out/make/squirrel.windows/**/*.exe
          - os: macos-latest
            name: macos-dmg-apple-silicon
            arch: arm64
            files: out/make/**/*.dmg
          - os: macos-latest
            name: macos-dmg-intel
            arch: x64
            files: out/make/**/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build installer
        run: npm run make -- --arch=${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: make
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # Remove the stale arch-less DMG from an earlier run of this release, if any.
      - name: Remove stale assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset "${{ inputs.release_tag || github.ref_name }}" WaterBuddy.dmg -y -R "${{ github.repository }}" || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: WaterBuddy ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/windows-exe/**/*.exe
            dist/macos-dmg-*/**/*.dmg
