name: Delete release

# Manual maintenance: removes a GitHub Release and its tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to delete (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --cleanup-tag --yes -R "${{ github.repository }}"
